# Builds livekit-rtc wheels for linux x86_64, linux arm64 and macOS arm64.
#
# Kept in its own file rather than edited into build-rtc.yml so that merging
# upstream main into dev never conflicts with it.
#
# Unlike upstream, the FFI library is built from the rust-sdks submodule rather
# than downloaded from a LiveKit release, so changes to the submodule end up in
# the wheel. The FFI build steps mirror fork-ffi.yml in supertest-ai/livekit-rust-sdks.

name: Fork RTC
on:
  pull_request:
    branches: ["dev"]
  push:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            build_image: sameli/manylinux_2_28_x86_64_cuda_12.3
            dylib: liblivekit_ffi.so
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            build_image: quay.io/pypa/manylinux_2_28_aarch64
            dylib: liblivekit_ffi.so
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - runner: macos-latest
            platform: macos
            dylib: liblivekit_ffi.dylib
            target: aarch64-apple-darwin
            macosx_deployment_target: "11.0"
            name: macos-arm64

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: livekit-rtc/rust-sdks
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        if: ${{ matrix.platform == 'macos' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: livekit-rtc/rust-sdks/target/
          key: internal-${{ runner.os }}-cargo-target-${{ matrix.target }}-${{ hashFiles('livekit-rtc/rust-sdks/Cargo.lock') }}
          restore-keys: |
            internal-${{ runner.os }}-cargo-target-${{ matrix.target }}-

      - name: Install Protoc
        if: ${{ matrix.platform == 'macos' }}
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "25.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build FFI (macOS)
        if: ${{ matrix.platform == 'macos' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: cd livekit-ffi && cargo build --release --target ${{ matrix.target }}

      # manylinux images, as upstream, so the library runs on any glibc >= 2.28.
      - name: Build FFI (Linux)
        if: ${{ matrix.platform == 'linux' }}
        run: |
          docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v $PWD:/workspace -w /workspace ${{ matrix.build_image }} bash -c "\
            set -e; \
            yum install clang clang-devel lld protobuf-compiler -y; \
            yum groupinstall 'Development Tools' -y; \
            yum install openssl-devel libX11-devel mesa-libGL-devel libXext-devel libva-devel libdrm-devel libgbm-devel libXdamage-devel libXrandr-devel libXfixes-devel libXcomposite-devel -y; \
            export LIBCLANG_PATH=/usr/lib64 CC=clang CXX=clang++; \
            curl --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y; \
            export PATH=/root/.cargo/bin:\$PATH; \
            cd livekit-ffi && cargo build --release --target ${{ matrix.target }}; \
            chown -R \$HOST_UID:\$HOST_GID /workspace/target"

      - name: Stage FFI into the package
        run: |
          res=../livekit/rtc/resources
          cp "target/${{ matrix.target }}/release/${{ matrix.dylib }}" livekit-ffi/include/livekit_ffi.h "$res/"
          echo "# livekit" > "$res/LICENSE.md"
          echo '```' >> "$res/LICENSE.md"
          cat LICENSE >> "$res/LICENSE.md"
          echo '```' >> "$res/LICENSE.md"
          cat livekit-ffi/WEBRTC_LICENSE.md >> "$res/LICENSE.md"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # The package is pure Python plus the bundled library, so no cibuildwheel:
      # setup.py derives the platform tag from the runner and
      # MACOSX_DEPLOYMENT_TARGET.
      - name: Build wheel
        working-directory: livekit-rtc
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Smoke-test wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "${{ github.workspace }}"/livekit-rtc/dist/*.whl
          python -c "from livekit.rtc._ffi_client import get_ffi_lib; get_ffi_lib()"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rtc-wheel-${{ matrix.name }}
          path: livekit-rtc/dist/*.whl
          retention-days: 14
